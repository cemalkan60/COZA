name: Fashion EAS Update

on:
  push:
    branches:
      - main
    paths:
      - "fashion-frontend/**"

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashion-frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm install

      - name: Publish OTA update (preview)
        run: eas update --channel preview --environment preview --message "Auto update from ${{ github.sha }}" --non-interactive
